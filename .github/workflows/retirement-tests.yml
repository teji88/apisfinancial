name: Retirement tests

on:
  push:
    branches: [main, retirement-rebuild-step26]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build
